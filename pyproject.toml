[project]
name = "rag-agent"
version = "0.1.0"
description = "Self-managed RAG system on AWS — built chapter by chapter."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.35,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
