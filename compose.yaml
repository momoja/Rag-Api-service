# rag-agent local dev environment.
#
# Two services:
# - app: the Lambda-parity Python 3.12 dev image (hermetic: deps + code
#   baked, no bind mounts — rebuild for code changes).
# - db: Postgres 16 + pgvector (Chapter 8), mirroring the RDS instance the
#   production index-document Lambda writes to. The same SQL and driver run
#   here and in production — the vector-store parity guarantee.
#
# The integration suite (tests/test_vector_integration.py) auto-skips when
# no database answers; host runs reach the db service on localhost:5432
# (the published port), in-container runs use TEST_DB_DSN (service name).
#
# The app image is intentionally not network-bound to db for the hermetic
# unit suite; TEST_DB_DSN is only consumed by the gated integration tests.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: rag-agent:dev
    environment:
      TEST_DB_DSN: postgresql://rag:rag@db:5432/rag
    depends_on:
      db:
        condition: service_healthy
